[project]
name = "tiltgraph"
version = "0.1.0"
description = "A trading journal as a graph that an agent asks before the next trade, and that checks its own advice. One Relate file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["relate-db>=1.2.0"]

[project.optional-dependencies]
test = ["pytest"]
mcp = ["mcp>=1.2"]

[project.scripts]
tiltgraph = "tiltgraph.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tiltgraph"]

[tool.setuptools.package-data]
tiltgraph = ["evidence.json"]
