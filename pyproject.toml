[project]
name = "tiltgraph"
version = "0.1.0"
description = "A trader's memory as a graph: what you do right after a loss, in one Relate file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["relate-db>=1.2.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tiltgraph = "tiltgraph.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tiltgraph"]
